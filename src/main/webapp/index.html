<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Manejo de Sesiones</title>
    <!-- Importar Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Iconos de Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* Fondo con degradado */
        body {
            background: linear-gradient(135deg, #007bff, #6610f2);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        /* Tarjeta central */
        .session-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            width: 340px;
            padding: 2rem;
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        /* Título */
        .session-card h1 {
            color: #0d6efd;
            margin-bottom: 1.5rem;
            font-weight: 600;
        }

        /* Botones */
        .btn-custom {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        /* Animación suave */
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>
<div class="session-card">
    <h1><i class="bi bi-person-circle"></i> Sesiones</h1>

    <div class="d-grid gap-3">
        <a href="/manejosesiones/productos" class="btn btn-outline-success btn-custom">
            <i class="bi bi-box-seam"></i> Ver Productos
        </a>

        <a href="/manejosesiones/login" class="btn btn-outline-primary btn-custom">
            <i class="bi bi-door-open"></i> Login
        </a>

        <a href="/manejosesiones/logout" class="btn btn-outline-danger btn-custom">
            <i class="bi bi-box-arrow-right"></i> Logout
        </a>
    </div>
</div>

<!-- Script de Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
