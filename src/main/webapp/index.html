<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Manejo de Sesiones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        /* Fondo con degradado */
        body {
            /* Usando colores de Bootstrap para coherencia */
            background: linear-gradient(135deg, #0d6efd, #6f42c1);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Arial, sans-serif;
            padding: 20px;
        }

        /* Tarjeta central */
        .session-card {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 380px;
            padding: 2rem;
            text-align: center;
            animation: fadeIn 0.8s ease;
        }

        /* Botones */
        .btn-custom {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-weight: 600;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }

        /* Animación suave */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
<div class="session-card">
    <h1 class="mb-4"><i class="bi bi-person-circle"></i> Sesiones Web</h1>

    <div class="d-grid gap-3">

        <a href="productos" class="btn btn-primary btn-custom">
            <i class="bi bi-box-seam"></i> Ver Productos
        </a>

        <a href="login.html" class="btn btn-outline-primary btn-custom">
            <i class="bi bi-door-open"></i> Iniciar Sesión (Login)
        </a>

        <a href="logout" class="btn btn-outline-danger btn-custom">
            <i class="bi bi-box-arrow-right"></i> Cerrar Sesión (Logout)
        </a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
